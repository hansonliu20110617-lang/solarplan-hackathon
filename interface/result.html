<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolarPlan — Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f4f6f8;
    --muted: rgba(244,246,248,.55);
    --gold: #F59E0B;
    --emerald: #34d399;
    --coral: #ff6b5b;
    --bg: #070B14;
    --card: rgba(17,24,39,.68);
    --border: rgba(255,255,255,.1);
    --mono: 'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace;
    --sans: 'Inter', -apple-system, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
  }
  body {
    max-width: 980px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  .gridbg {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  header { margin-bottom: 32px; }
  .eyebrow {
    font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: 3px;
    color: var(--gold); text-transform: uppercase;
  }
  h1 { font-size: 34px; font-weight: 800; margin: 8px 0 4px; }
  .subtitle { color: var(--muted); font-size: 15px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
    margin: 20px 0;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .card h2 {
    font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin: 0 0 16px;
  }
  .stat-row { display: flex; flex-wrap: wrap; gap: 28px; }
  .stat { min-width: 140px; }
  .stat .big { font-family: var(--mono); font-size: 28px; font-weight: 700; }
  .stat .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .pos { color: var(--emerald); } .neg { color: var(--coral); } .warn { color: var(--gold); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  tbody tr:hover { background: rgba(255,255,255,.03); }
  .mono { font-family: var(--mono); }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono);
    font-size: 13px; font-weight: 700; letter-spacing: 1px; padding: 6px 14px;
    border-radius: 999px; border: 1px solid; white-space: nowrap;
  }
  .badge.solar { color: var(--emerald); border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.1); }
  .badge.grid { color: var(--coral); border-color: rgba(255,107,91,.4); background: rgba(255,107,91,.1); }
  .sim-controls { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .sim-controls label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
  select {
    background: rgba(255,255,255,.06); color: var(--ink); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; font-family: var(--mono); font-size: 14px; min-width: 180px;
  }
  .sim-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .sim-col {
    border: 1px solid var(--border); border-radius: 12px; padding: 18px; text-align: center;
    background: rgba(255,255,255,.02);
  }
  .sim-col .who { font-family: var(--mono); font-size: 12px; letter-spacing: 2px; color: var(--muted); margin-bottom: 10px; }
  .sim-col .reading { font-family: var(--mono); font-size: 22px; font-weight: 700; margin-top: 10px; }
  .sim-col .verdict { margin-top: 6px; font-size: 13px; }
  .sim-col.correct { border-color: rgba(52,211,153,.35); }
  .sim-col.wrong { border-color: rgba(255,107,91,.35); }
  .assumptions { font-size: 13px; color: var(--muted); margin-top: 16px; line-height: 1.6; }
  footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
  .error-note { color: var(--coral); }
  @media (max-width: 640px) {
    .sim-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

  <div class="assumptions" id="sim-footnote"></div>

(function () {
  var data = window.RESULTS_DATA;
  var summaryEl = document.getElementById("summary");
  var subtitleEl = document.getElementById("subtitle");
  var tbody = document.querySelector("#cases-table tbody");
  var footerEl = document.getElementById("provenance");

  if (!data) {
    summaryEl.textContent = "No results data found.";
    return;
  }
  subtitleEl.textContent = "Validated against " + data.n_cases + " real, held-out daily readings never seen during training.";

  function fmt(n) {
    return (typeof n === "number") ? n.toFixed(4) : String(n);
  }
  function pct(n) {
    return (typeof n === "number") ? (n * 100).toFixed(1) + "%" : String(n);
  }
  function fmtKwh(n) {
    return (typeof n === "number") ? n.toFixed(2) : String(n);
  }

  summaryEl.innerHTML =
    "<div class=\"stat-row\">" +
    "<div class=\"stat\"><div class=\"big\">" + data.n_cases + "</div><div class=\"label\">held-out cases</div></div>" +
    "<div class=\"stat\"><div class=\"big\">" + fmt(data.median_error) + "</div><div class=\"label\">model median error (kWh/m&sup2;)</div></div>" +
    "<div class=\"stat\"><div class=\"big\">" + fmt(data.p95_error) + "</div><div class=\"label\">95th percentile error</div></div>" +
    "<div class=\"stat\"><div class=\"big error-note\">" + fmt(data.worst_error) + "</div><div class=\"label\">worst case</div></div>" +
    "</div>";

  var compareEl = document.getElementById("baseline-compare");
  if (typeof data.baseline_median_error === "number") {
    var skill = data.skill_score;
    var beatsSkill = typeof skill === "number" && skill > 0;
    var beatsMedian = data.beats_baseline;
    function cmpRow(label, model, baseline, modelWins) {
      return "<tr><td>" + label + "</td>" +
        "<td class=\"mono " + (modelWins ? "pos" : "") + "\">" + fmt(model) + "</td>" +
        "<td class=\"mono\">" + fmt(baseline) + "</td></tr>";
    }
    compareEl.innerHTML =
      "<div class=\"card\"><h2>Baseline check</h2>" +
      "<div class=\"stat-row\" style=\"margin-bottom:18px;\">" +
      "<div class=\"stat\"><div class=\"big " + (beatsSkill ? "pos" : "error-note") + "\">" +
      (typeof skill === "number" ? (skill >= 0 ? "+" : "") + skill.toFixed(3) : "n/a") + "</div>" +
      "<div class=\"label\">skill score (1 &minus; RMSE<sub>model</sub>/RMSE<sub>baseline</sub>)</div></div>" +
      "</div>" +
      "Persistence baseline (\"tomorrow = today\") is a non-trivial baseline, not a strawman. Our model " +
      (beatsSkill ? "<strong class=\"pos\">beats</strong>" : "<span class=\"error-note\">does not beat</span>") +
      " it on skill score &mdash; the standard solar-forecasting-literature metric (RMSE-based) &mdash; " +
      "and on decision accuracy below, the metric that actually matters for the homeowner's choice." +
      (beatsMedian ? "" :
        " <em>One narrower metric moves the other way:</em> median error alone is slightly higher than the " +
        "baseline's (medians track the typical small-error day; RMSE and skill score weight how the harder " +
        "days go, which is what the appliance-timing decision actually depends on) &mdash; the full comparison:") +
      "<table style=\"margin-top:14px;\"><thead><tr><th>metric</th><th>model</th><th>baseline</th></tr></thead><tbody>" +
      cmpRow("RMSE", data.rmse, data.baseline_rmse, data.rmse < data.baseline_rmse) +
      cmpRow("mean error", data.mean_error, data.baseline_mean_error, data.mean_error < data.baseline_mean_error) +
      cmpRow("median error", data.median_error, data.baseline_median_error, data.median_error < data.baseline_median_error) +
      "</tbody></table></div>";
  }

  var decisionEl = document.getElementById("decision-sim");
  if (data.decision) {
    var d = data.decision;
    decisionEl.innerHTML =
      "<div class=\"card\"><h2>The decision that actually matters</h2>" +
      "\"Enough sun to run a high-draw appliance off solar tonight, or charge from the grid?\" " +
      "Our model's yes/no call matched what the homeowner should have actually done " +
      "<strong class=\"pos mono\">" + pct(d.model.correct_rate) + "</strong> of the time, vs. " +
      "<strong class=\"mono\">" + pct(d.baseline.correct_rate) + "</strong> for the naive persistence rule " +
      "(majority-class floor: " + pct(d.majority_class_accuracy) + ").</div>";
  }

  // ---- Try a Day simulator ----
  var allCases = data.all_cases || [];
  if (allCases.length) {
    var simCard = document.getElementById("simulator-card");
    var citySel = document.getElementById("sim-city");
    var dateSel = document.getElementById("sim-date");
    var grid = document.getElementById("sim-grid");
    var byCity = {};
    allCases.forEach(function (c) {
      (byCity[c.city] = byCity[c.city] || []).push(c);
    });
    Object.keys(byCity).forEach(function (c) { byCity[c].sort(function (a, b) { return a.date < b.date ? -1 : 1; }); });
    var cities = Object.keys(byCity).sort();
    cities.forEach(function (c) {
      var opt = document.createElement("option");
      opt.value = c; opt.textContent = c.charAt(0).toUpperCase() + c.slice(1);
      citySel.appendChild(opt);
    });

    function decisionBadge(flag) {
      return flag
        ? "<span class=\"badge solar\">&#9728; WAIT FOR SOLAR</span>"
        : "<span class=\"badge grid\">&#9889; GRID TONIGHT</span>";
    }

    function renderDates() {
      dateSel.innerHTML = "";
      byCity[citySel.value].forEach(function (c) {
        var opt = document.createElement("option");
        opt.value = c.date; opt.textContent = c.date;
        dateSel.appendChild(opt);
      });
    }

    function renderCase() {
      var rows = byCity[citySel.value];
      var row = rows.filter(function (c) { return c.date === dateSel.value; })[0] || rows[0];
      var oracle = row.oracle_decision;
      function col(who, decision, reading, color, isActual) {
        var correct = decision === oracle;
        return "<div class=\"sim-col " + (isActual ? "correct" : (correct ? "correct" : "wrong")) + "\">" +
          "<div class=\"who\">" + who + "</div>" +
          decisionBadge(decision) +
          "<div class=\"reading\" style=\"color:" + color + ";\">" + fmtKwh(reading) + " kWh/m&sup2;</div>" +
          "<div class=\"verdict\">" + (isActual ? "&nbsp;" : (correct ? "&#10003; matched reality" : "&#10007; got it wrong")) + "</div>" +
          "</div>";
      }
      grid.innerHTML =
        col("NAIVE (BASELINE)", row.baseline_decision, row.baseline_pred, "#ff6b5b") +
        col("SOLARPLAN (MODEL)", row.model_decision, row.pred, "#F59E0B") +
        col("ACTUAL OUTCOME", oracle, row.true, "#34d399", true);
      document.getElementById("sim-footnote").innerHTML =
        "Decision threshold for " + citySel.value + " that day: <span class=\"mono\">" + fmtKwh(row.threshold) +
        " kWh/m&sup2;</span> (each city's own median training-period irradiance &mdash; never peeks at test data).";
    }

    citySel.addEventListener("change", function () { renderDates(); renderCase(); });
    dateSel.addEventListener("change", renderCase);

    // Default to the Seattle / Aug 13 2024 case when present -- the one
    // walked through in the demo video -- else just the first city/date.
    if (byCity["seattle"]) { citySel.value = "seattle"; }
    renderDates();
    if (byCity[citySel.value].some(function (c) { return c.date === "2024-08-13"; })) {
      dateSel.value = "2024-08-13";
    }
    renderCase();
    simCard.style.display = "";
  }

  var cityEl = document.getElementById("city-breakdown");
  if (data.per_city) {
    var rows = "";
    Object.keys(data.per_city).sort().forEach(function (city) {
      var c = data.per_city[city];
      var cd = c.decision || {};
      rows += "<tr><td>" + city + "</td><td class=\"mono\">" + c.n + "</td>" +
        "<td class=\"mono\">" + fmt(c.model.mean_error) + "</td>" +
        "<td class=\"mono\">" + fmt(c.baseline.mean_error) + "</td>" +
        "<td class=\"mono pos\">" + pct(cd.model && cd.model.correct_rate) + "</td>" +
        "<td class=\"mono\">" + pct(cd.baseline && cd.baseline.correct_rate) + "</td></tr>";
    });
    cityEl.innerHTML =
      "<div class=\"card\"><h2>By city</h2><table><thead><tr><th>city</th><th>n</th>" +
      "<th>model mean error</th><th>baseline mean error</th>" +
      "<th>model decision accuracy</th><th>baseline decision accuracy</th></tr></thead>" +
      "<tbody>" + rows + "</tbody></table></div>";
  }

  // ---- Real-world impact (only if pipeline/estimate_impact.py has been run) ----
  var impactEl = document.getElementById("impact-card");
  var impactBody = document.getElementById("impact-body");
  if (data.impact_estimate) {
    var imp = data.impact_estimate;
    var rows2 = "";
    Object.keys(imp.per_city).sort().forEach(function (city) {
      var c = imp.per_city[city];
      rows2 += "<tr><td>" + city + "</td>" +
        "<td class=\"mono pos\">+$" + c.annual_savings_usd.toFixed(2) + "</td>" +
        "<td class=\"mono pos\">+" + c.annual_kwh_shifted_to_solar.toFixed(0) + " kWh</td>" +
        "<td class=\"mono pos\">+" + c.annual_co2_avoided_kg.toFixed(0) + " kg CO2</td></tr>";
    });
    impactBody.innerHTML =
      "<div class=\"stat-row\" style=\"margin-bottom:20px;\">" +
      "<div class=\"stat\"><div class=\"big pos\">+$" + imp.pooled_avg_savings_per_household_per_year_usd.toFixed(2) + "</div>" +
      "<div class=\"label\">avg savings / household / yr</div></div>" +
      "<div class=\"stat\"><div class=\"big pos\">+" + imp.pooled_avg_co2_avoided_kg_per_household_per_year.toFixed(0) + " kg</div>" +
      "<div class=\"label\">avg CO2 avoided / household / yr</div></div>" +
      "</div>" +
      "<table><thead><tr><th>city</th><th>$ saved / yr</th><th>kWh shifted to solar / yr</th><th>CO2 avoided / yr</th></tr></thead>" +
      "<tbody>" + rows2 + "</tbody></table>" +
      "<div class=\"assumptions\">Illustrative, stated assumptions, not measured: " +
      imp.assumptions.appliance_kwh_per_day + " kWh/day high-draw appliance load, $" +
      imp.assumptions.retail_price_per_kwh + "/kWh retail rate, " +
      imp.assumptions.false_confidence_multiplier + "&times; cost multiplier for an unplanned grid top-up, " +
      imp.assumptions.grid_co2_kg_per_kwh + " kg CO2/kWh grid emissions intensity. Source: " + imp.assumptions.source +
      ". Averaged across all ten independent walk-forward validation years &mdash; change these assumptions and " +
      "re-run <span class=\"mono\">pipeline/estimate_impact.py</span> if you have better numbers.</div>";
    impactEl.style.display = "";
  }

  (data.cases || []).forEach(function (c) {
    var row = document.createElement("tr");
    [c.city, c.date, fmt(c.true), fmt(c.pred), fmt(c.baseline_pred), fmt(c.error)].forEach(function (val, i) {
      var cell = document.createElement("td");
      cell.textContent = val;
      if (i > 1) cell.className = "mono";
      row.appendChild(cell);
    });
    tbody.appendChild(row);
  });

  var provenance = data.provenance || {};
  footerEl.innerHTML =
    "<strong>How this was validated:</strong> " + (data.source || "unknown source") + " " +
    (provenance.predictions_source ? "Predictions from " + provenance.predictions_source + ". " : "") +
    (provenance.note || "");
})();
</script>
